<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İÜ Yoklama Kararları</title>
<meta name="description" content="İstanbul Üniversitesi yoklama uygulaması: araştırma özeti, kararlar, kapsam ve açık sorular (29 Eylül 2026).">
<style>
:root{
  --bg:#f7f7f5; --surface:#ffffff; --surface-2:#f1f1ee; --text:#1c1d1f; --muted:#5d6068;
  --line:#e2e2de; --accent:#8a1c2b; --accent-soft:#f6e9eb; --link:#1d4ed8;
  --ok:#136c3a; --ok-soft:#e6f4ec; --warn:#8a5a00; --warn-soft:#fbf1dc;
  --no:#6b6f76; --no-soft:#eceded; --q:#1f4e8c; --q-soft:#e7eef9;
  --risk:#a32020; --risk-soft:#fbe9e9; --code:#f0efe9;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.05);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131416; --surface:#1b1c1f; --surface-2:#222327; --text:#e8e8e6; --muted:#a2a5ab;
    --line:#2e3035; --accent:#e0848f; --accent-soft:#3a1f24; --link:#8ab4ff;
    --ok:#6fd49a; --ok-soft:#173325; --warn:#f0c46a; --warn-soft:#3a2f16; --no:#b3b6bb; --no-soft:#2a2b2f;
    --q:#9cc2ff; --q-soft:#1c2a40; --risk:#ff9a9a; --risk-soft:#3d1c1c; --code:#26272b;
    --shadow:none; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131416; --surface:#1b1c1f; --surface-2:#222327; --text:#e8e8e6; --muted:#a2a5ab;
  --line:#2e3035; --accent:#e0848f; --accent-soft:#3a1f24; --link:#8ab4ff;
  --ok:#6fd49a; --ok-soft:#173325; --warn:#f0c46a; --warn-soft:#3a2f16; --no:#b3b6bb; --no-soft:#2a2b2f;
  --q:#9cc2ff; --q-soft:#1c2a40; --risk:#ff9a9a; --risk-soft:#3d1c1c; --code:#26272b;
  --shadow:none; color-scheme: dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15.5px/1.6 "Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif}
a{color:var(--link);text-underline-offset:2px}
code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.88em;background:var(--code);padding:.1em .35em;border-radius:5px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 80px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px}
nav.toc{position:sticky;top:20px;align-self:start;font-size:13.5px}
nav.toc b{display:block;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:11.5px;margin-bottom:8px}
nav.toc ol{list-style:none;margin:0;padding:0}
nav.toc li a{display:block;padding:5px 10px;border-radius:7px;color:var(--text);text-decoration:none}
nav.toc li a:hover{background:var(--surface-2)}
main{min-width:0}
header.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
h1{font-size:28px;line-height:1.2;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.theme-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 22px}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--surface);padding:3px 10px;border-radius:99px;color:var(--muted)}
section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 22px 18px;margin:0 0 18px}
section>h2{font-size:19px;margin:0 0 12px;display:flex;gap:10px;align-items:baseline}
section>h2 .n{color:var(--accent);font-variant-numeric:tabular-nums}
h3{font-size:15.5px;margin:18px 0 8px}
p{margin:.4em 0 .8em}
ul,ol{margin:.3em 0 .9em;padding-left:1.3em}
li{margin:.2em 0}
.glance{background:var(--accent-soft);border-color:transparent}
.glance ul{margin:0;padding-left:1.1em}
.glance li{margin:.35em 0}
.note{border-left:3px solid var(--accent);background:var(--surface-2);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0 14px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.b{display:inline-block;font-size:11.5px;font-weight:650;letter-spacing:.02em;padding:1px 8px;border-radius:99px;white-space:nowrap;vertical-align:1px}
.b-mvp{background:var(--ok-soft);color:var(--ok)}
.b-later{background:var(--warn-soft);color:var(--warn)}
.b-no{background:var(--no-soft);color:var(--no)}
.b-q{background:var(--q-soft);color:var(--q)}
.b-risk{background:var(--risk-soft);color:var(--risk)}
table{width:100%;border-collapse:collapse;font-size:14.3px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:650;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:var(--surface)}
.card h4{margin:0 0 6px;font-size:14px}
.card ul{margin:0;padding-left:1.1em;font-size:14px}
.card.ok{border-top:3px solid var(--ok)} .card.warn{border-top:3px solid var(--warn)} .card.risk{border-top:3px solid var(--risk)}
.steps{counter-reset:s;list-style:none;padding:0}
.steps li{counter-increment:s;position:relative;padding-left:34px;margin:.55em 0}
.steps li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700;display:grid;place-items:center}
.phase{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 2px}
details{border:1px solid var(--line);border-radius:9px;padding:0 14px;margin:10px 0;background:var(--surface)}
details>summary{cursor:pointer;padding:11px 0;font-weight:600;list-style-position:inside}
details[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details>*:last-child{margin-bottom:12px}
blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid var(--line);color:var(--text);background:var(--surface-2);border-radius:0 6px 6px 0;font-size:13.8px}
.src{font-size:13.5px;columns:2;column-gap:28px}
.src li{break-inside:avoid}
.formula{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;background:var(--code);padding:8px 12px;border-radius:8px;display:inline-block;margin:4px 0}
@media (max-width:900px){
  .wrap{grid-template-columns:1fr;gap:0}
  nav.toc{position:static;margin-bottom:14px}
  nav.toc ol{display:flex;flex-wrap:wrap;gap:4px}
  nav.toc li a{border:1px solid var(--line);background:var(--surface);padding:4px 9px}
  .grid3{grid-template-columns:1fr}
  .src{columns:1}
}
@media (max-width:720px){
  section{padding:16px 14px 12px}
  h1{font-size:23px}
  table.stack thead{display:none}
  table.stack, table.stack tbody, table.stack tr, table.stack td{display:block;width:100%}
  table.stack tr{border:1px solid var(--line);border-radius:9px;margin:0 0 10px;padding:4px 0;background:var(--surface)}
  table.stack td{border:0;padding:5px 12px}
  table.stack td::before{content:attr(data-l);display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  table.stack td:first-child{font-size:15px}
  table.stack td:first-child::before{display:none}
}
@media print{
  :root{--bg:#fff;--surface:#fff;--surface-2:#f4f4f4;--text:#000;--muted:#444;--line:#ccc;--link:#000;color-scheme:light}
  body{font-size:11pt}
  .wrap{display:block;padding:0}
  nav.toc,.theme-btn{display:none}
  section{break-inside:auto;border:0;padding:0;margin:0 0 14pt;box-shadow:none}
  details{border:0;padding:0}
  details>summary{list-style:none}
  a{text-decoration:none}
  tr,.card{break-inside:avoid}
}
</style>
</head>
