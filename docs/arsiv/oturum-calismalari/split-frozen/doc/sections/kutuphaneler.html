<section id="kutuphaneler" class="sec">
<div class="sec-h"><p class="sec-no">{{no}}</p><div><h2>Kütüphaneler</h2><p class="lead">Tasarımı telefonda ve web panelinde kuran kütüphaneler: her konuda seçim, kullanılacak sürüm, tek cümlelik neden, yedek ve üç ölçüm.</p></div></div>
<style>
#kutuphaneler .kt-oku .body + .body { margin-top: 8px; }
#kutuphaneler .lib-wrap, #kutuphaneler .lib-cmd { overflow-x: auto; max-width: 100%; border: 1px solid var(--border-subtle); outline: 2px solid transparent; outline-offset: 0; transition: outline-color var(--dur-mikro) var(--ease-standart), outline-offset var(--dur-mikro) var(--ease-standart); }
#kutuphaneler .lib-wrap { background: var(--bg-surface); }
#kutuphaneler .lib-wrap:focus-visible, #kutuphaneler .lib-cmd:focus-visible { outline-color: var(--focus-ring); outline-offset: -2px; }
#kutuphaneler .lib-table { width: 100%; min-width: 880px; table-layout: fixed; border-collapse: separate; border-spacing: 0; font: 400 13px/19px var(--font-sans); letter-spacing: 0.16px; }
#kutuphaneler .lib-table .c-konu { width: 14%; }
#kutuphaneler .lib-table .c-secim { width: 30%; }
#kutuphaneler .lib-table .c-neden { width: 36%; }
#kutuphaneler .lib-table .c-yedek { width: 20%; }
#kutuphaneler .lib-table th, #kutuphaneler .lib-table td { padding: 12px 16px; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border-subtle); }
#kutuphaneler .lib-table thead th { font: 600 12px/16px var(--font-sans); letter-spacing: 0.32px; color: var(--text-secondary); background: var(--bg-sunken); white-space: nowrap; vertical-align: bottom; }
#kutuphaneler .lib-table tbody th[scope="row"] { font: 600 13px/19px var(--font-sans); letter-spacing: 0.16px; color: var(--text-primary); background: var(--bg-surface); }
#kutuphaneler .lib-table thead th:first-child, #kutuphaneler .lib-table tbody th[scope="row"] { position: sticky; left: 0; z-index: 1; box-shadow: inset -1px 0 0 var(--border-subtle); }
#kutuphaneler .lib-table tbody tr:last-child > * { border-bottom: 0; }
#kutuphaneler .lib-table code { white-space: nowrap; }
#kutuphaneler .lib-table .lib-pkg { padding: 0; background: none; font: 500 12px/19px var(--font-mono); letter-spacing: 0; color: var(--text-primary); white-space: normal; }
#kutuphaneler .lib-pkg span { white-space: nowrap; }
#kutuphaneler .lib-table .lib-v { margin-top: 4px; font: 400 12px/16px var(--font-sans); letter-spacing: 0.32px; color: var(--text-secondary); }
#kutuphaneler .lib-table .lib-v .lib-pkg { font-weight: 400; line-height: 16px; color: inherit; }
#kutuphaneler .lib-table .lib-m { margin-top: 8px; font-variant-numeric: tabular-nums; }
#kutuphaneler .lib-m span { display: block; font: 400 12px/16px var(--font-sans); letter-spacing: 0.32px; color: var(--text-secondary); }
#kutuphaneler .lib-none { color: var(--text-secondary); }
#kutuphaneler .lib-cmd { margin-top: 12px; background: var(--bg-sunken); }
#kutuphaneler .lib-cmd pre { margin: 0; padding: 12px 16px; font: 400 12px/18px var(--font-mono); letter-spacing: 0; white-space: pre; }
#kutuphaneler .lib-cmd code { padding: 0; background: none; font: inherit; }
#kutuphaneler .lib-cmd + .body { margin-top: 12px; }
@media (prefers-reduced-motion: reduce) {
  #kutuphaneler .lib-wrap, #kutuphaneler .lib-cmd { transition: none; }
}
/* Narrow screens: each row becomes a card (topic, then labelled Seçim, Neden, Yedek), so nothing hides behind a sideways
   scroll; the table roles in the markup keep the semantics that display: block would drop. */
@media (max-width: 720px) {
  #kutuphaneler .kt-tablolar h3 { font-size: 20px; line-height: 28px; }
  #kutuphaneler .lib-wrap { overflow: visible; border: 0; background: none; }
  #kutuphaneler .lib-table, #kutuphaneler .lib-table tbody, #kutuphaneler .lib-table tr, #kutuphaneler .lib-table th, #kutuphaneler .lib-table td { display: block; width: auto; min-width: 0; }
  #kutuphaneler .lib-table colgroup, #kutuphaneler .lib-table thead { display: none; }
  #kutuphaneler .lib-table tbody tr { border: 1px solid var(--border-subtle); background: var(--bg-surface); }
  #kutuphaneler .lib-table tbody tr + tr { margin-top: 12px; }
  #kutuphaneler .lib-table tbody th[scope="row"] { position: static; box-shadow: none; padding: 12px 16px 4px; border-bottom: 0; font-size: 14px; line-height: 20px; }
  #kutuphaneler .lib-table td { padding: 8px 16px; border-bottom: 0; }
  #kutuphaneler .lib-table td:last-child { padding-bottom: 16px; }
  #kutuphaneler .lib-table td::before { content: attr(data-label); display: block; margin-bottom: 2px; font: 600 12px/16px var(--font-sans); letter-spacing: 0.32px; color: var(--text-secondary); }
}
</style>
<div class="kt-tablolar">

</div>
</section>
