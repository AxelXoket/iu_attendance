<section id="kutuphaneler" class="sec">
<div class="sec-h"><p class="sec-no">{{no}}</p><div><h2>Kütüphaneler</h2><p class="lead">Tasarımı telefonda ve web panelinde kuran kütüphaneler. Her tablonun başlığı kararı tek satırda söyler; açınca her konuda seçim, kullanılacak sürüm, tek cümlelik neden, yedek ve üç ölçüm.</p></div></div>
<style>
#kutuphaneler code { white-space: nowrap; }
#kutuphaneler .kt-oku { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 32px; margin-bottom: 24px; }
#kutuphaneler .kt-oku .body { max-width: 70ch; margin: 0; }
@media (max-width: 900px) { #kutuphaneler .kt-oku { grid-template-columns: minmax(0, 1fr); } }
#kutuphaneler .kt-det + .kt-det { margin-top: 8px; }
#kutuphaneler .kt-det summary { font-weight: 400; }
#kutuphaneler .kt-det summary b { font-weight: 600; }
#kutuphaneler .kt-det > div > .body + .body, #kutuphaneler .kt-det > div > .lib-cmd + .body { margin-top: 12px; }
#kutuphaneler .lib-wrap, #kutuphaneler .lib-cmd { max-width: 100%; }
#kutuphaneler .lib-table { width: 100%; table-layout: fixed; border-collapse: collapse; font: 400 13px/20px var(--font-sans); letter-spacing: 0.16px; }
#kutuphaneler .lib-table .c-konu { width: 14%; }
#kutuphaneler .lib-table .c-secim { width: 30%; }
#kutuphaneler .lib-table .c-neden { width: 36%; }
#kutuphaneler .lib-table .c-yedek { width: 20%; }
#kutuphaneler .lib-table th, #kutuphaneler .lib-table td { padding: 12px 16px 12px 0; text-align: left; vertical-align: top; border-bottom: 1px solid var(--border-subtle); }
#kutuphaneler .lib-table thead th { padding-top: 4px; font: 600 12px/16px var(--font-sans); letter-spacing: 0.32px; color: var(--text-secondary); background: none; border-bottom: 1px solid var(--text-primary); white-space: nowrap; vertical-align: bottom; }
#kutuphaneler .lib-table tbody th[scope="row"] { font: 600 13px/20px var(--font-sans); letter-spacing: 0.16px; color: var(--text-primary); background: none; }
#kutuphaneler .lib-table tbody tr:last-child > * { border-bottom: 0; }
#kutuphaneler .lib-table .lib-pkg { padding: 0; background: none; font: 500 12px/20px var(--font-mono); letter-spacing: 0; color: var(--text-primary); white-space: normal; }
#kutuphaneler .lib-pkg span { white-space: nowrap; }
#kutuphaneler .lib-table .lib-v { margin-top: 4px; font: 400 12px/16px var(--font-sans); letter-spacing: 0.32px; color: var(--text-secondary); }
#kutuphaneler .lib-table .lib-v .lib-pkg { font-weight: 400; line-height: 16px; color: inherit; }
#kutuphaneler .lib-table .lib-m { margin-top: 8px; font-variant-numeric: tabular-nums; }
#kutuphaneler .lib-m span { display: block; font: 400 12px/16px var(--font-sans); letter-spacing: 0.32px; color: var(--text-secondary); }
#kutuphaneler .lib-none { color: var(--text-secondary); }
#kutuphaneler .lib-cmd { margin-top: 12px; background: var(--bg-sunken); }
/* The command wraps inside its box (the long --unicodes value breaks anywhere), so nothing hides behind a sideways scroll. */
#kutuphaneler .lib-cmd pre { margin: 0; padding: 12px 16px; font: var(--type-panel-kod-01); letter-spacing: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
#kutuphaneler .lib-cmd code { padding: 0; background: none; font: inherit; white-space: inherit; }
/* Narrow screens: each row becomes a card (topic, then labelled Seçim, Neden, Yedek), so nothing hides behind a sideways
   scroll; the table roles in the markup keep the semantics that display: block would drop. */
@media (max-width: 900px) {
  #kutuphaneler .lib-table, #kutuphaneler .lib-table tbody, #kutuphaneler .lib-table tr, #kutuphaneler .lib-table th, #kutuphaneler .lib-table td { display: block; width: auto; min-width: 0; }
  #kutuphaneler .lib-table colgroup, #kutuphaneler .lib-table thead { display: none; }
  #kutuphaneler .lib-table tbody tr { padding: 12px 0; border-bottom: 1px solid var(--border-subtle); }
  #kutuphaneler .lib-table tbody tr:last-child { border-bottom: 0; }
  #kutuphaneler .lib-table tbody th[scope="row"] { padding: 0 0 4px; border-bottom: 0; font-size: 14px; line-height: 20px; }
  #kutuphaneler .lib-table td { padding: 6px 0; border-bottom: 0; }
  #kutuphaneler .lib-table td::before { content: attr(data-label); display: block; margin-bottom: 2px; font: 600 12px/16px var(--font-sans); letter-spacing: 0.32px; color: var(--text-secondary); }
}
</style>
