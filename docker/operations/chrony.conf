# chrony on the host (module D15). BIDB's NTP server comes first and the Turkish pool backs
# it up. BIDB has not named its server yet (an open question with the machine request,
# D15-A01): until it does, the line below stays a comment and the pool alone keeps the
# time. Fill in the name BIDB gives and remove the comment sign; nothing else changes.
# server <BIDB NTP server> iburst prefer
pool tr.pool.ntp.org iburst

# Step the clock only at start-up (the first three updates, by more than one second); after
# that chrony slews it, so the time never jumps under a running lesson.
makestep 1.0 3

# Keep the hardware clock in step, and the drift across restarts.
rtcsync
driftfile /var/lib/chrony/chrony.drift
