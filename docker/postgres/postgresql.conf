# Server settings of the attendance PostgreSQL cluster (module D12, database).
#
# compose.yaml mounts this file read only at /etc/postgresql/postgresql.conf and starts the
# server with -c config_file=...; the postgresql.conf that initdb writes into the data
# directory is never read. ALTER SYSTEM is switched off: settings change here, not from SQL.
# The values are the starting point for 8 GB of RAM and 4 cores; the load test corrects them
# and the final values are written to teknik.html. postgres-test overrides durability,
# archiving, shared_buffers and the log collector on its command line (compose.yaml).

# Connections and authentication
hba_file = '/etc/postgresql/pg_hba.conf'
listen_addresses = '*'                  # containers on the database network; production publishes no port
max_connections = 100                   # budget: 64 in use, ceiling 80
password_encryption = scram-sha-256

# Memory
shared_buffers = 2GB
effective_cache_size = 4GB
work_mem = 16MB
maintenance_work_mem = 512MB

# Disk I/O
io_method = worker
effective_io_concurrency = 200
random_page_cost = 1.1

# Write-ahead log and checkpoints
wal_compression = zstd
max_wal_size = 4GB
min_wal_size = 1GB
checkpoint_timeout = 15min

# WAL archive for point-in-time recovery (pgBackRest, stanza "attendance")
archive_mode = on
archive_command = 'pgbackrest --stanza=attendance archive-push %p'
archive_timeout = 300                   # seconds: a WAL segment closes at least every 5 minutes

# Planner
jit = off

# Statistics
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on

# Time
timezone = 'UTC'
log_timezone = 'UTC'

# Logging. No value reaches the server log: ERROR messages are not written at all (an error
# such as 22P02 carries the rejected value in its main message), DETAIL lines are dropped,
# failing statements and bind parameters are never logged, and a slow parameterized
# statement shows only its placeholders. The SQLSTATE stays in the application log.
log_min_messages = log
log_error_verbosity = terse
log_min_error_statement = panic
log_parameter_max_length = 0
log_parameter_max_length_on_error = 0
log_min_duration_statement = 500ms
log_lock_waits = on
log_autovacuum_min_duration = 1s
log_temp_files = 10MB

# Administration
allow_alter_system = off
