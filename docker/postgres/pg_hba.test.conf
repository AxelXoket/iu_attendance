# Client authentication of the test cluster postgres-test (module D12, database).
#
# postgres-test starts with -c hba_file=/etc/postgresql/pg_hba.test.conf (compose.yaml). It
# runs on its own network 172.30.13.0/24 and publishes 127.0.0.1:5433 only; test processes
# on the host arrive through the network gateway (172.30.13.1). Every password is checked
# with SCRAM-SHA-256 and nothing is trusted, as in production.
#
# Tests log in with the four production login roles. The superuser works from the
# maintenance database (postgres): it drops and copies the test databases, and the setup
# step then reaches each new database, so the lines cover every database: test database
# names change from run to run. The socket line is for the image's entrypoint, and the
# pg_healthcheck line for the health check that postgres-test shares with production (see
# pg_hba.conf: the reserved role lets nobody in, and the check leaves no log line).
#
# TYPE  DATABASE  USER                                                                         ADDRESS           METHOD
local   all       postgres                                                                                       peer
host    all       postgres                                                                     172.30.13.0/24    scram-sha-256
host    all       attendance_migration,attendance_api,attendance_worker,attendance_retention   172.30.13.0/24    scram-sha-256
host    postgres  pg_healthcheck                                                               127.0.0.1/32      scram-sha-256

# Everything else is refused. A line added below these two never takes effect.
local   all       all                                                                                            reject
host    all       all                                                                          all               reject
