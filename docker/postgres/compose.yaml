# PostgreSQL services of the attendance system (module D12, database).
#
# The root compose.yaml takes this file once (include: [docker/postgres/compose.yaml]), so
# relative paths below resolve against this directory. Development adds compose.dev.yaml
# (127.0.0.1:5432, pg_hba.dev.conf, archive_mode=off); that layer never goes to the server.
#
#   postgres       production cluster, no profile, publishes no port
#   postgres-test  test cluster: same image, settings, environment, secrets and health
#                  check; data on tmpfs, durability off, own network and pg_hba file,
#                  127.0.0.1:5433. Start: docker compose --profile test up --wait postgres-test
#   backup         one-shot restic runs: docker compose --profile backup run --rm backup ...
#
# Secret files live in IU_SECRETS_DIR, an absolute path (/opt/... on the server; the
# development and test files come from generate-dev-secrets.sh).
#
# The image name carries the PostgreSQL version of the Dockerfile's FROM line and the
# upstream pgBackRest version; version-check.sh fails CI when they differ. A rebuild under the
# same name (a new FROM digest only) needs docker compose build before up.

x-postgres-common: &postgres-common
  build: .
  image: iu-attendance-postgres:18.6-pgbackrest2.59.3
  environment:
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    # initdb runs only on an empty volume.
    POSTGRES_INITDB_ARGS: >-
      --locale-provider=builtin --builtin-locale=C.UTF-8 --locale=C.UTF-8 --encoding=UTF8
      --auth-local=peer --auth-host=scram-sha-256 --data-checksums
  secrets: [postgres_password]
  shm_size: 256mb
  # The entrypoint's temporary server listens only on the socket, so an answer over TCP
  # means the real server is up. The check asks as the reserved role pg_healthcheck for the
  # database postgres, which both pg_hba files meet with a scram-sha-256 line: the server
  # answers with a password request, pg_isready counts that as ready and leaves, and the
  # server log stays empty (a refused check would log a FATAL line every 5 seconds).
  healthcheck:
    test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "pg_healthcheck", "-d", "postgres"]
    interval: 5s
    retries: 24
  logging:
    driver: local
    options: { max-size: 50m, max-file: "5" }

services:
  postgres:
    <<: *postgres-common
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    # Long syntax: a missing file stops the start instead of turning into an empty directory.
    # pgbackrest.conf and the pgbackrest_secret file come with the backup scripts.
    volumes:
      - data:/var/lib/postgresql
      - { type: bind, source: ./postgresql.conf, target: /etc/postgresql/postgresql.conf, read_only: true }
      - { type: bind, source: ./pg_hba.conf, target: /etc/postgresql/pg_hba.conf, read_only: true }
      - { type: bind, source: ./pgbackrest.conf, target: /etc/pgbackrest/pgbackrest.conf, read_only: true }
    secrets:
      - postgres_password
      - { source: pgbackrest_secret, target: /etc/pgbackrest/conf.d/secret.conf }
    restart: unless-stopped
    # Room for the shutdown checkpoint (shared_buffers 2GB); the 10 s default would kill it.
    stop_grace_period: 2m
    networks: [database]

  postgres-test:
    <<: *postgres-common
    profiles: [test]
    # Durability and archiving are off only here; the production service never carries them.
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf",
              "-c", "hba_file=/etc/postgresql/pg_hba.test.conf",
              "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off",
              "-c", "archive_mode=off", "-c", "shared_buffers=512MB", "-c", "logging_collector=on"]
    volumes:
      - { type: tmpfs, target: /var/lib/postgresql, tmpfs: { size: 2147483648 } }
      - { type: bind, source: ./postgresql.conf, target: /etc/postgresql/postgresql.conf, read_only: true }
      - { type: bind, source: ./pg_hba.test.conf, target: /etc/postgresql/pg_hba.test.conf, read_only: true }
    ports: ["127.0.0.1:5433:5432"]
    networks: [database-test]

  backup:
    profiles: [backup]
    image: restic/restic:0.19.1@sha256:136600b6ff6843d61d355f7f71f460a166429f35de6fd11b568fece3c9a4d510
    secrets: [restic_secret]
    logging:
      driver: local
      options: { max-size: 50m, max-file: "5" }

volumes:
  data:
    # A restore from a dump opens a fresh volume by changing this name.
    name: ${IU_POSTGRES_VOLUME:-iu-attendance-postgres-data}

networks:
  database:
    # The migration service takes the fixed 172.30.12.20 (root compose.yaml); every other
    # container gets an address from 172.30.12.128/25, so none can take the fixed one.
    ipam:
      config:
        - subnet: 172.30.12.0/24
          ip_range: 172.30.12.128/25
  database-test:
    ipam:
      config:
        - subnet: 172.30.13.0/24

# The role passwords serve services of the root compose.yaml too (migration, API, worker,
# xprem); each service binds only the secrets it needs.
secrets:
  postgres_password:
    file: ${IU_SECRETS_DIR:?absolute path of the secrets directory}/postgres_password
  attendance_migration_password:
    file: ${IU_SECRETS_DIR:?absolute path of the secrets directory}/attendance_migration_password
  attendance_api_password:
    file: ${IU_SECRETS_DIR:?absolute path of the secrets directory}/attendance_api_password
  attendance_worker_password:
    file: ${IU_SECRETS_DIR:?absolute path of the secrets directory}/attendance_worker_password
  attendance_retention_password:
    file: ${IU_SECRETS_DIR:?absolute path of the secrets directory}/attendance_retention_password
  xprem_password:
    file: ${IU_SECRETS_DIR:?absolute path of the secrets directory}/xprem_password
  pgbackrest_secret:
    file: ${IU_SECRETS_DIR:?absolute path of the secrets directory}/pgbackrest_secret
  restic_secret:
    file: ${IU_SECRETS_DIR:?absolute path of the secrets directory}/restic_secret
