# Client authentication of the production cluster (module D12, database).
#
# compose.yaml mounts this file read only at /etc/postgresql/pg_hba.conf and postgresql.conf
# points hba_file at it. The first matching line decides; every password is checked with
# SCRAM-SHA-256 and nothing is trusted.
#
# Inside the container pgBackRest and the nightly dump reach the server through the socket
# as the postgres operating system user (peer). Over the network the superuser comes only
# from the migration service's fixed address 172.30.12.20 (the root compose.yaml gives it;
# every other container takes an address from 172.30.12.128/25): the setup step reaches the
# maintenance database first and then the attendance database. The API, the worker, xprem
# and the host behind the gateway (172.30.12.1) can never log in as postgres.
#
# The pg_healthcheck line serves the health check of compose.yaml (pg_isready over TCP
# inside the container, -U pg_healthcheck -d postgres). PostgreSQL reserves role names that
# start with pg_, so that role can never exist and the line lets nobody in: the server only
# answers the check with a password request, and the check leaves without a log line.
#
# TYPE  DATABASE             USER                                                                         ADDRESS           METHOD
local   all                  postgres                                                                                       peer
host    postgres,attendance  postgres                                                                     172.30.12.20/32   scram-sha-256
host    attendance           attendance_migration,attendance_api,attendance_worker,attendance_retention   172.30.12.0/24    scram-sha-256
host    xprem                xprem                                                                        172.30.12.0/24    scram-sha-256
host    postgres             pg_healthcheck                                                               127.0.0.1/32      scram-sha-256

# Everything else is refused. A line added below these two never takes effect.
local   all                  all                                                                                            reject
host    all                  all                                                                          all               reject
